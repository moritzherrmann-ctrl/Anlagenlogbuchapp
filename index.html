<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Anlagenbuch Kälte · Heizung · Trinkwasser</title>
  <meta name="description" content="Anlagenbuch / Logbuch für Kälte- und Klimaanlagen nach F-Gase-Verordnung (EU) 2024/573">
  <meta name="theme-color" content="#0b5cab">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Anlagenbuch">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <a href="#/" class="brand" aria-label="Startseite">
      <img src="icons/icon.svg" alt="" width="28" height="28">
      <span id="brandText">Anlagenbuch</span>
    </a>
    <nav class="topnav">
      <a href="#/" data-nav="kunden">Bereiche</a>
      <a href="#/einstellungen" data-nav="einstellungen">Einstellungen</a>
    </nav>
  </header>

  <main id="main" class="container" tabindex="-1"></main>

  <!-- Unterschrift-Dialog -->
  <div id="sigModal" class="modal" hidden>
    <div class="modal-card sig-card" role="dialog" aria-modal="true" aria-labelledby="sigTitle">
      <h2 id="sigTitle">Unterschrift</h2>
      <p id="sigHint" class="muted small"></p>
      <label class="field">
        <span>Name (Klartext)</span>
        <input id="sigName" type="text" autocomplete="name">
      </label>
      <div class="sig-wrap">
        <canvas id="sigCanvas"></canvas>
        <div class="sig-line"><span>✕</span></div>
      </div>
      <div class="actions">
        <button type="button" class="btn ghost" id="sigClear">Löschen</button>
        <span class="spacer"></span>
        <button type="button" class="btn ghost" id="sigCancel">Abbrechen</button>
        <button type="button" class="btn primary" id="sigOk">Unterschrift übernehmen</button>
      </div>
    </div>
  </div>

  <div id="toast" class="toast" hidden></div>

  <script src="vendor/jspdf.umd.min.js"></script>
  <script src="vendor/jspdf.plugin.autotable.min.js"></script>
  <script src="js/files.js"></script>
  <script src="js/data.js"></script>
  <script src="js/areas.js"></script>
  <script src="js/signature.js"></script>
  <script src="js/pdf.js"></script>
  <script src="js/generic.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
